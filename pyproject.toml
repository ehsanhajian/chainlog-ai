[project]
name = "chainlog-ai"
version = "0.3.0"
description = "Explain why blockchain infrastructure failed, from the logs you already have."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
  "ethereum",
  "geth",
  "lighthouse",
  "validator",
  "kubernetes",
  "incident",
  "logs",
]
authors = [{ name = "ehsanhajian" }]
classifiers = [
  "Development Status :: 1 - Planning",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/ehsanhajian/chainlog-ai"
Issues = "https://github.com/ehsanhajian/chainlog-ai/issues"
Changelog = "https://github.com/ehsanhajian/chainlog-ai/releases"

[project.scripts]
chainlog-ai = "chainlog_ai.cli:main"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chainlog_ai = ["bip39_english.txt", "catalog.json", "runbook.json", "metrics.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
